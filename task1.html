<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication table</title>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <main>
        <h1>Multiplication table</h1>
        <form id="table-form" class="fields">
            <label for="num">Number</label>
            <input id="num" type="number" step="any" required>
            <button type="submit">Get table</button>
        </form>
        <p id="table-status" role="status"></p>
        <ol id="result"></ol>
    </main>
    <script>
        const form = document.getElementById("table-form");
        const input = document.getElementById("num");
        const result = document.getElementById("result");
        const status = document.getElementById("table-status");

        form.addEventListener("input", () => {
            result.replaceChildren();
            status.textContent = "";
        });

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const factor = input.valueAsNumber;
            result.replaceChildren();
            if (!Number.isFinite(factor * 10)) {
                status.textContent = "Use a smaller number to show all ten products.";
                return;
            }
            for (let multiplier = 1; multiplier <= 10; multiplier++) {
                const row = document.createElement("li");
                row.textContent = `${factor} × ${multiplier} = ${factor * multiplier}`;
                result.append(row);
            }
            status.textContent = `Multiplication table for ${factor}.`;
        });
    </script>
</body>
</html>
