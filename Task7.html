<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color table rows</title>
    <link rel="stylesheet" href="assets/site.css">
    <style>
        table { border-collapse: collapse; }
        th, td { border: 1px solid #625066; padding: .4rem .75rem; text-align: left; }
        caption { text-align: left; font-weight: bold; }
        .colored { color: white; background: purple; }
    </style>
</head>
<body>
    <main>
        <h1>Color table rows</h1>
        <p>
            <label for="row-group">Rows to color</label>
            <select id="row-group">
                <option value="all">All data rows</option>
                <option value="odd">Odd data rows</option>
                <option value="even">Even data rows</option>
            </select>
        </p>
        <table id="Mytable">
            <caption>Students by branch</caption>
            <thead><tr><th scope="col">ID</th><th scope="col">Name</th><th scope="col">Branch</th></tr></thead>
            <tbody>
                <tr><td>1</td><td>Aditya</td><td>CSE</td></tr>
                <tr><td>2</td><td>Sanjay</td><td>CSE</td></tr>
                <tr><td>3</td><td>Abhishek</td><td>CSE</td></tr>
            </tbody>
        </table>
        <p><output id="row-status" for="row-group"></output></p>
    </main>
    <script>
        const picker = document.getElementById("row-group");
        const rows = document.querySelectorAll("#Mytable tbody tr");

        function colorRows() {
            let colored = 0;
            for (const [index, row] of rows.entries()) {
                const parity = (index + 1) % 2 === 0 ? "even" : "odd";
                const matches = picker.value === "all" || picker.value === parity;
                row.classList.toggle("colored", matches);
                if (matches) colored++;
            }
            document.getElementById("row-status").value =
                `${colored} of ${rows.length} data rows colored.`;
        }

        picker.addEventListener("change", colorRows);
        colorRows();
    </script>
    <footer class="exercise-return"><a href="index.html#exercises">Back to exercise directory</a></footer>
</body>
</html>
