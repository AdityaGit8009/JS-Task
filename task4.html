<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swap two panels</title>
    <link rel="stylesheet" href="assets/site.css">
    <style>
        .panels { display: flex; flex-wrap: wrap; gap: 1rem; }
        .panels div { border-radius: .5rem; padding: 1rem; min-height: 3rem; color: white; }
        #first { background: #952f2f; }
        #second { background: #24623b; }
    </style>
</head>
<body>
    <main>
        <h1>Swap two panels</h1>
        <p>
            <button id="previous" type="button">Previous</button>
            <button id="next" type="button">Next</button>
        </p>
        <div class="panels">
            <div id="first">This is div 1</div>
            <div id="second">This is div 2</div>
        </div>
        <p id="order-status" role="status"></p>
    </main>
    <script>
        const first = document.getElementById("first");
        const second = document.getElementById("second");

        function swap() {
            const firstText = first.textContent;
            first.textContent = second.textContent;
            second.textContent = firstText;
            document.getElementById("order-status").textContent =
                `The first panel reads “${first.textContent}”. The second reads “${second.textContent}”.`;
        }

        document.getElementById("previous").addEventListener("click", swap);
        document.getElementById("next").addEventListener("click", swap);
    </script>
    <footer class="exercise-return"><a href="index.html#exercises">Back to exercise directory</a></footer>
</body>
</html>
