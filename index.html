<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student details | JavaScript exercises</title>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <main>
        <h1>Student details</h1>
        <form id="student-form" class="fields">
            <label for="name">Name</label>
            <input id="name" name="name" autocomplete="name" required>
            <label for="branch">Branch</label>
            <input id="branch" name="branch" required>
            <label for="eroll">Enrollment number</label>
            <input id="eroll" name="eroll" inputmode="numeric" pattern="[0-9]+" title="Use digits only" required>
            <label for="cname">College name</label>
            <input id="cname" name="cname" autocomplete="organization" required>
            <button type="submit">Submit details</button>
        </form>

        <section id="details" class="record" aria-labelledby="submitted-title" hidden>
            <h2 id="submitted-title">Submitted details</h2>
            <dl>
                <dt>Name</dt><dd data-field="name"></dd>
                <dt>Branch</dt><dd data-field="branch"></dd>
                <dt>Enrollment number</dt><dd data-field="eroll"></dd>
                <dt>College name</dt><dd data-field="cname"></dd>
            </dl>
        </section>
        <button id="copy" type="button" disabled>Copy submitted details</button>
        <section id="show" class="record" aria-labelledby="copied-title" hidden>
            <h2 id="copied-title">Copied details</h2>
        </section>
        <p id="student-status" role="status"></p>
    </main>
    <script>
        const form = document.getElementById("student-form");
        const details = document.getElementById("details");
        const copied = document.getElementById("show");
        const record = details.querySelector("dl");
        const copyButton = document.getElementById("copy");
        const studentStatus = document.getElementById("student-status");

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            for (const input of form.querySelectorAll("input")) {
                input.value = input.value.trim();
            }
            if (!form.reportValidity()) return;

            const values = new FormData(form);
            for (const entry of record.querySelectorAll("dd")) {
                entry.textContent = values.get(entry.dataset.field);
            }
            details.hidden = false;
            copyButton.disabled = false;
            studentStatus.textContent = "Details submitted.";
        });

        copyButton.addEventListener("click", () => {
            const previousCopy = copied.querySelector("dl");
            if (previousCopy) previousCopy.remove();
            copied.append(record.cloneNode(true));
            copied.hidden = false;
            studentStatus.textContent = "Submitted details copied.";
        });
    </script>
</body>
</html>
