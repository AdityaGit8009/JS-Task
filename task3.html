<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare three heights</title>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <main>
        <h1>Compare three heights</h1>
        <form id="height-form" class="fields">
            <label for="fph">First person’s height (cm)</label>
            <input id="fph" data-person="First person" type="number" min="0" step="any" required>
            <label for="sph">Second person’s height (cm)</label>
            <input id="sph" data-person="Second person" type="number" min="0" step="any" required>
            <label for="tph">Third person’s height (cm)</label>
            <input id="tph" data-person="Third person" type="number" min="0" step="any" required>
            <button type="submit">Check heights</button>
        </form>
        <output id="h1" for="fph sph tph"></output>
    </main>
    <script>
        const form = document.getElementById("height-form");
        const inputs = Array.from(form.querySelectorAll("input"));
        const result = document.getElementById("h1");

        form.addEventListener("input", () => { result.value = ""; });
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const heights = inputs.map((input) => input.valueAsNumber);
            if (heights.some((height) => height <= 0)) {
                result.value = "Each height must be greater than zero.";
                return;
            }
            const maximum = Math.max(...heights);
            const tallest = inputs.filter((input) => input.valueAsNumber === maximum)
                .map((input) => input.dataset.person);
            const people = new Intl.ListFormat("en").format(tallest);
            const description = tallest.length === 1 ? "is tallest" : "tie for tallest";
            result.value = `${people} ${description} at ${maximum} cm.`;
        });
    </script>
    <footer class="exercise-return"><a href="index.html#exercises">Back to exercise directory</a></footer>
</body>
</html>
