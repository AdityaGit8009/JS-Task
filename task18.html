<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian PIN code validation</title>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <main>
        <h1>Indian PIN code validation</h1>
        <form id="pin-form" class="fields" novalidate>
            <label for="pin">PIN code</label>
            <input id="pin" type="text" inputmode="numeric" autocomplete="postal-code" required aria-describedby="pin-hint">
            <p id="pin-hint">Enter six digits, starting with 1 through 9.</p>
            <button type="submit">Validate</button>
        </form>
        <output id="msg" for="pin"></output>
    </main>
    <script>
        const form = document.getElementById("pin-form");
        const input = document.getElementById("pin");
        const result = document.getElementById("msg");

        input.addEventListener("input", () => {
            input.removeAttribute("aria-invalid");
            result.value = "";
        });
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const valid = /^[1-9][0-9]{5}$/.test(input.value.trim());
            input.setAttribute("aria-invalid", String(!valid));
            result.value = valid ? "Valid PIN code." : "Enter six digits with a nonzero first digit.";
        });
    </script>
</body>
</html>
