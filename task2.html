<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arithmetic calculator</title>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <main>
        <h1>Arithmetic calculator</h1>
        <form id="calculator">
            <div class="fields">
                <label for="fnum">First number</label>
                <input id="fnum" type="number" step="any" required>
                <label for="snum">Second number</label>
                <input id="snum" type="number" step="any" required>
            </div>
            <button type="submit" value="add">Addition</button>
            <button type="submit" value="subtract">Subtraction</button>
            <button type="submit" value="multiply">Multiplication</button>
            <button type="submit" value="divide">Division</button>
            <button type="submit" value="remainder">Modulus</button>
        </form>
        <p><output id="result" for="fnum snum"></output></p>
    </main>
    <script>
        const form = document.getElementById("calculator");
        const result = document.getElementById("result");
        const operations = {
            add: (first, second) => first + second,
            subtract: (first, second) => first - second,
            multiply: (first, second) => first * second,
            divide: (first, second) => first / second,
            remainder: (first, second) => first % second
        };

        form.addEventListener("input", () => { result.value = ""; });
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const first = document.getElementById("fnum").valueAsNumber;
            const second = document.getElementById("snum").valueAsNumber;
            const operation = event.submitter?.value ?? "add";
            if (second === 0 && (operation === "divide" || operation === "remainder")) {
                result.value = "The divisor must be different from zero.";
                return;
            }
            const answer = operations[operation](first, second);
            result.value = Number.isFinite(answer) ? String(answer) : "The result is outside the number range.";
        });
    </script>
    <footer class="exercise-return"><a href="index.html#exercises">Back to exercise directory</a></footer>
</body>
</html>
