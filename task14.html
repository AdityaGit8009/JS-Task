<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlight odd and even items</title>
    <link rel="stylesheet" href="assets/site.css">
    <style>
        .odd { color: #9b2626; text-decoration: underline; }
        .even { color: #1f6335; font-weight: bold; }
    </style>
</head>
<body>
    <main>
        <h1>Highlight odd and even items</h1>
        <fieldset>
            <legend>Highlight positions</legend>
            <label><input id="odd" type="checkbox" checked> Odd</label>
            <label><input id="even" type="checkbox" checked> Even</label>
        </fieldset>
        <ol id="myList">
            <li>Item One</li>
            <li>Item Two</li>
            <li>Item Three</li>
            <li>Item Four</li>
            <li>Item Five</li>
            <li>Item Six</li>
        </ol>
        <output id="count" for="odd even"></output>
    </main>
    <script>
        const items = document.querySelectorAll("#myList li");
        const odd = document.getElementById("odd");
        const even = document.getElementById("even");

        function highlight() {
            let highlighted = 0;
            for (const [index, item] of items.entries()) {
                const isOdd = (index + 1) % 2 === 1;
                item.classList.toggle("odd", isOdd && odd.checked);
                item.classList.toggle("even", !isOdd && even.checked);
                if (item.classList.length) highlighted++;
            }
            document.getElementById("count").value = `${highlighted} of ${items.length} items highlighted.`;
        }

        odd.addEventListener("change", highlight);
        even.addEventListener("change", highlight);
        highlight();
    </script>
    <footer class="exercise-return"><a href="index.html#exercises">Back to exercise directory</a></footer>
</body>
</html>
