<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show or hide an image</title>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <main>
        <h1>Show or hide an image</h1>
        <img id="myImg" src="banner-2025-2.webp" width="250" alt="A cricket ground viewed from the stadium stands">
        <p>
            <button id="show-image" type="button" aria-controls="myImg">Show</button>
            <button id="hide-image" type="button" aria-controls="myImg">Hide</button>
            <button id="toggle-image" type="button" aria-controls="myImg" aria-pressed="true">Toggle image visibility</button>
        </p>
        <output id="image-status">Image shown.</output>
    </main>
    <script>
        const image = document.getElementById("myImg");
        const toggle = document.getElementById("toggle-image");
        const status = document.getElementById("image-status");

        function setVisible(visible) {
            image.hidden = !visible;
            toggle.setAttribute("aria-pressed", String(visible));
            status.value = visible ? "Image shown." : "Image hidden.";
        }

        document.getElementById("show-image").addEventListener("click", () => setVisible(true));
        document.getElementById("hide-image").addEventListener("click", () => setVisible(false));
        toggle.addEventListener("click", () => setVisible(image.hidden));
    </script>
</body>
</html>
