<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website URL validation</title>
    <link rel="stylesheet" href="assets/site.css">
</head>
<body>
    <main>
        <h1>Website URL validation</h1>
        <form id="url-form" class="fields">
            <label for="url">Website address</label>
            <input id="url" type="text" inputmode="url" autocomplete="url" aria-describedby="url-hint">
            <p id="url-hint">Enter a domain such as example.com, with an optional http:// or https:// prefix.</p>
            <button type="submit">Validate</button>
        </form>
        <output id="msg" for="url"></output>
    </main>
    <script>
        const form = document.getElementById("url-form");
        const input = document.getElementById("url");
        const result = document.getElementById("msg");

        function isWebsiteAddress(value) {
            const hasScheme = /^[a-z][a-z0-9+.-]*:\/\//i.test(value);
            const address = hasScheme ? value : "https://" + value;
            if (/\s|\\/.test(value) || !/^https?:\/\/[^/?#]/i.test(address)) return false;

            try {
                const url = new URL(address);
                if (!hasScheme && (url.username || url.password)) return false;
                const hostname = url.hostname.replace(/\.$/, "");
                const labels = hostname.split(".");
                const domainLabel = /^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/i;
                const suffix = labels[labels.length - 1];
                return hostname.length <= 253 && labels.length > 1 &&
                    labels.every((label) => domainLabel.test(label)) &&
                    (/^[a-z]{2,}$/i.test(suffix) || suffix.startsWith("xn--"));
            } catch {
                return false;
            }
        }

        input.addEventListener("input", () => {
            input.removeAttribute("aria-invalid");
            result.value = "";
        });
        form.addEventListener("submit", (event) => {
            event.preventDefault();
            const address = input.value.trim();
            const valid = isWebsiteAddress(address);
            input.setAttribute("aria-invalid", String(!valid));
            if (!address) {
                result.value = "Please enter a URL.";
                return;
            }
            result.value = valid ? "Valid website URL." : "Enter a website with a valid domain and an HTTP or HTTPS address.";
        });
    </script>
</body>
</html>
